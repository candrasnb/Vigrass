<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dunia Belajar Anak Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', cursive, sans-serif; }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-float { animation: floatSlow 4s ease-in-out infinite; }
        .animate-pop { animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="bg-gradient-to-tr from-violet-900 via-indigo-800 to-blue-900 min-h-screen flex items-center justify-center p-4 text-slate-800 relative overflow-x-hidden">

    <!-- Background Glow -->
    <div class="absolute top-10 left-10 w-32 h-32 bg-pink-500/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-40 h-40 bg-cyan-400/30 rounded-full blur-3xl pointer-events-none"></div>

    <div class="bg-white/95 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl p-5 md:p-8 w-full max-w-lg border-4 border-white/60 animate-pop relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <div class="inline-block bg-gradient-to-r from-amber-400 to-orange-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 shadow-sm animate-float">
                ✨ Akademi Cerdas Si Kecil ✨
            </div>
            <h1 class="text-xl md:text-2xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent leading-tight">
                Dunia Belajar Anak Cerdas – Main Sambil Berhitung & Menjelajah 🌍
            </h1>
            <p class="text-slate-500 text-sm mt-1">Pilih petualangan belajarmu hari ini!</p>
        </div>

        <!-- Setup Screen -->
        <div id="setup-screen" class="space-y-2.5 max-h-[72vh] overflow-y-auto pr-1">
            <div class="bg-indigo-50 p-3 rounded-2xl border-2 border-indigo-100 text-center shadow-inner">
                <p class="text-indigo-900 font-bold text-sm">Pilih kategori latihan:</p>
            </div>
            <div class="grid grid-cols-1 gap-2.5">
                <button onclick="playSound('click'); startQuiz('semua')" class="w-full bg-gradient-to-r from-fuchsia-600 to-pink-600 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🌟 Semua Materi (Benar-Benar Campuran)</span>
                </button>
                <button onclick="playSound('click'); startQuiz('angka')" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🔢 Pengenalan Angka & Hitung Benda</span>
                </button>
                <button onclick="playSound('click'); startQuiz('hitung')" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>➕ Hitung Seru (Tambah & Kurang)</span>
                </button>
                <button onclick="playSound('click'); startQuiz('bentuk')" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🎨 Mengenal Bentuk & Warna</span>
                </button>
                <button onclick="playSound('click'); startQuiz('pola')" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🧩 Pola Urutan (Pattern)</span>
                </button>
                <button onclick="playSound('click'); startQuiz('konsep')" class="w-full bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🐘 Besar/Kecil & Panjang/Pendek</span>
                </button>
                <button onclick="playSound('click'); startQuiz('mewarnai')" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🎨 Seni & Campuran Warna</span>
                </button>
                <button onclick="playSound('click'); startQuiz('hewan')" class="w-full bg-gradient-to-r from-yellow-600 to-amber-600 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🦁 Dunia Hewan & Satwa</span>
                </button>
                <button onclick="playSound('click'); startQuiz('tumbuhan')" class="w-full bg-gradient-to-r from-green-600 to-emerald-700 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🌱 Mengenal Tumbuhan & Alam</span>
                </button>
                <button onclick="playSound('click'); startQuiz('inggris')" class="w-full bg-gradient-to-r from-blue-600 to-sky-600 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🔤 Belajar Bahasa Inggris Dasar</span>
                </button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden relative z-10 animate-pop">
            <div class="flex justify-between items-center mb-3 text-sm font-bold text-slate-500">
                <span id="question-progress" class="bg-slate-100 px-3.5 py-1 rounded-full shadow-sm">Soal 1 dari 10</span>
                <div class="flex gap-2">
                    <button onclick="speakCurrentQuestion()" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full shadow-sm hover:bg-indigo-200 text-xs font-extrabold flex items-center gap-1">🔊 Ulangi Suara</button>
                    <span id="score-tracker" class="bg-amber-100 text-amber-800 px-3.5 py-1 rounded-full shadow-sm">🏆 Skor: 0</span>
                </div>
            </div>

            <!-- Card Soal Bergambar -->
            <div id="question-card" class="bg-gradient-to-br from-indigo-50/90 to-purple-50/90 p-4 rounded-3xl border-2 border-indigo-200 mb-4 flex flex-col items-center justify-center text-center shadow-inner min-h-[130px]">
                <div id="question-image" class="text-4xl md:text-5xl mb-2 animate-float"></div>
                <h2 id="question-text" class="text-base md:text-lg font-bold text-slate-800 leading-snug">Pertanyaan...</h2>
            </div>

            <!-- Pilihan Ganda -->
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-4"></div>

            <div id="feedback-container" class="hidden mb-3 p-3 rounded-2xl text-center font-bold text-sm md:text-base shadow-md animate-pop"></div>

            <button id="next-btn" onclick="playSound('click'); nextQuestion()" class="hidden w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-lg text-base transition transform hover:scale-[1.01] active:scale-95">
                Soal Berikutnya ➡️
            </button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center space-y-4 relative z-10 animate-pop py-6">
            <div class="text-7xl mb-2 animate-float">🎉</div>
            <h2 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Luar Biasa Hebat!</h2>
            <p id="final-score-text" class="text-slate-600 text-base md:text-lg font-semibold">Kamu hebat sudah menyelesaikan sesi latihan ini.</p>
            <div>
                <button onclick="playSound('click'); resetQuiz()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-xl text-base transition transform hover:scale-105 active:scale-95">
                    🔄 Pilih Latihan Lain
                </button>
            </div>
        </div>

    </div>

    <script>
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let totalQuestionsCount = 10;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentQuestion() {
            const q = currentQuestions[currentIndex];
            speakText(q.text);
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getUniqueQuestions(pool, count) {
            let uniqueMap = new Map();
            for (let item of pool) {
                if (!uniqueMap.has(item.text)) {
                    uniqueMap.set(item.text, item);
                }
            }
            let uniqueList = Array.from(uniqueMap.values());
            let shuffled = shuffleArray(uniqueList);
            return shuffled.slice(0, count);
        }

        // --- BANK SOAL AMAN & TERSTRUKTUR ---
        function getAngkaBank() {
            let list = [];
            let icons = ['⭐', '🍎', '🚗', '🎈', '🐶', '⚽', '🐱', '🍌', '🌸', '🍭', '🧸', '🚀', '🐟', '🍦', '🐣', '🍉', '🍕'];
            for (let i = 1; i <= 20; i++) {
                let icon = icons[(i * 3) % icons.length];
                let stringBenda = Array(i).fill(icon).join(' ');
                let w1 = i === 20 ? 17 : i + 2;
                let w2 = Math.max(1, i - 2);
                if (w1 === i) w1 = i + 1;
                list.push({ 
                    img: stringBenda, 
                    text: `Berapa jumlah total benda ${icon} pada gambar di atas?`, 
                    options: [
                        { text: i.toString(), correct: true },
                        { text: w1.toString(), correct: false },
                        { text: w2.toString(), correct: false }
                    ] 
                });
            }
            for (let i = 2; i <= 18; i++) {
                list.push({ 
                    img: `🔢`, 
                    text: `Angka berapakah yang posisinya tepat sesudah angka ${i}?`, 
                    options: [
                        { text: (i+1).toString(), correct: true },
                        { text: (i-1).toString(), correct: false },
                        { text: (i+2).toString(), correct: false }
                    ] 
                });
                list.push({ 
                    img: `🔢`, 
                    text: `Angka berapakah yang posisinya tepat sebelum angka ${i}?`, 
                    options: [
                        { text: (i-1).toString(), correct: true },
                        { text: (i+1).toString(), correct: false },
                        { text: (i-2).toString(), correct: false }
                    ] 
                });
            }
            return shuffleArray(list);
        }

        function getHitungBank() {
            let list = [];
            for (let a = 1; a <= 15; a++) {
                for (let b = 1; b <= 15; b++) {
                    let hasil = a + b;
                    let w1 = hasil + 2;
                    let w2 = Math.max(1, hasil - 2);
                    if (w1 === w2) w2 = hasil + 3;
                    list.push({ 
                        img: "➕", 
                        text: `Berapa hasil penjumlahan dari ${a} ditambah ${b}?`, 
                        options: [
                            { text: hasil.toString(), correct: true },
                            { text: w1.toString(), correct: false },
                            { text: w2.toString(), correct: false }
                        ] 
                    });
                }
            }
            for (let a = 4; a <= 20; a++) {
                for (let b = 1; b < a; b++) {
                    let hasil = a - b;
                    let w1 = hasil + 2;
                    let w2 = Math.max(0, hasil - 2);
                    if (w1 === w2) w2 = hasil + 3;
                    list.push({ 
                        img: "📉", 
                        text: `Berapa hasil pengurangan dari ${a} dikurangi ${b}?`, 
                        options: [
                            { text: hasil.toString(), correct: true },
                            { text: w1.toString(), correct: false },
                            { text: w2.toString(), correct: false }
                        ] 
                    });
                }
            }
            return shuffleArray(list);
        }

        function getBentukBank() {
            return shuffleArray([
                { img: "🔵", text: "Benda seperti roda mobil dan koin uang logam memiliki bentuk...", options: [{text: "Lingkaran", correct: true}, {text: "Segitiga", correct: false}, {text: "Persegi", correct: false}] },
                { img: "📖", text: "Buku cerita dan papan tulis kelas umumnya berbentuk...", options: [{text: "Persegi Panjang", correct: true}, {text: "Lingkaran", correct: false}, {text: "Trapesium", correct: false}] },
                { img: "⛺", text: "Bentuk potongan pizza atau atap tenda pramuka menyerupai...", options: [{text: "Segitiga", correct: true}, {text: "Persegi", correct: false}, {text: "Lingkaran", correct: false}] },
                { img: "🍃", text: "Daun pohon yang tumbuh subur dan sehat di taman biasanya berwarna...", options: [{text: "Hijau", correct: true}, {text: "Merah", correct: false}, {text: "Ungu", correct: false}] },
                { img: "🍌", text: "Buah pisang yang sudah matang dan manis berwarna...", options: [{text: "Kuning", correct: true}, {text: "Hitam", correct: false}, {text: "Biru", correct: false}] },
                { img: "🍓", text: "Buah stroberi segar yang siap dipetik di kebun berwarna...", options: [{text: "Merah", correct: true}, {text: "Hijau", correct: false}, {text: "Kuning", correct: false}] },
                { img: "🧊", text: "Kotak kado ulang tahun atau mainan kubus rubik berbentuk...", options: [{text: "Kubus / Persegi", correct: true}, {text: "Lingkaran", correct: false}, {text: "Elips", correct: false}] },
                { img: "⚽", text: "Bola sepak untuk bermain di lapangan berbentuk...", options: [{text: "Bola / Bulat", correct: true}, {text: "Kotak", correct: false}, {text: "Segitiga", correct: false}] },
                { img: "⭐", text: "Bentuk bintang kejora di langit malam biasanya mempunyai jumlah ujung...", options: [{text: "Lima", correct: true}, {text: "Tiga", correct: false}, {text: "Empat", correct: false}] },
                { img: "🚪", text: "Pintu kamar rumah umumnya memiliki bentuk dasar...", options: [{text: "Persegi Panjang", correct: true}, {text: "Lingkaran", correct: false}, {text: "Segitiga", correct: false}] }
            ]);
        }

        function getPolaBank() {
            return shuffleArray([
                { img: "🔴 🟦 🔴 🟦", text: "Lanjutkan pola warna merah dan biru berikutnya secara teratur.", options: [{text: "🔴", correct: true}, {text: "🟦", correct: false}, {text: "🟢", correct: false}] },
                { img: "⭐ 🌙 ⭐ 🌙", text: "Lanjutkan pola bentuk bintang dan bulan berikut ini.", options: [{text: "⭐", correct: true}, {text: "🌙", correct: false}, {text: "☀️", correct: false}] },
                { img: "2, 4, 6, 8", text: "Lanjutkan pola deret angka loncat dua: 2, 4, 6, 8, ...", options: [{text: "10", correct: true}, {text: "9", correct: false}, {text: "12", correct: false}] },
                { img: "🐱 🐶 🐱 🐶", text: "Lanjutkan urutan hewan kucing dan anjing berikutnya.", options: [{text: "🐱", correct: true}, {text: "🐶", correct: false}, {text: "🐰", correct: false}] },
                { img: "🍎 🍌 🍎 🍌", text: "Lanjutkan pola urutan buah apel dan pisang berikut.", options: [{text: "🍎", correct: true}, {text: "🍌", correct: false}, {text: "🍊", correct: false}] },
                { img: "1, 3, 5, 7", text: "Lanjutkan deret angka ganjil berikut ini: 1, 3, 5, 7, ...", options: [{text: "9", correct: true}, {text: "8", correct: false}, {text: "10", correct: false}] },
                { img: "🟢 🟡 🟢 🟡", text: "Lanjutkan urutan warna hijau dan kuning berikut.", options: [{text: "🟢", correct: true}, {text: "🟡", correct: false}, {text: "🔴", correct: false}] },
                { img: "10, 9, 8, 7", text: "Lanjutkan hitung mundur angka berikut: 10, 9, 8, 7, ...", options: [{text: "6", correct: true}, {text: "5", correct: false}, {text: "8", correct: false}] },
                { img: "🔺 🔹 🔺 🔹", text: "Lanjutkan pola bentuk segitiga dan belah ketupat ini.", options: [{text: "🔺", correct: true}, {text: "🔹", correct: false}, {text: "🟥", correct: false}] }
            ]);
        }

        function getKonsepBank() {
            return shuffleArray([
                { img: "🐘", text: "Di antara pilihan hewan berikut, manakah yang tubuhnya paling besar?", options: [{text: "Gajah", correct: true}, {text: "Kucing", correct: false}, {text: "Semut", correct: false}] },
                { img: "🍇", text: "Di antara buah-buahan berikut, manakah yang ukurannya paling kecil?", options: [{text: "Buah Anggur", correct: true}, {text: "Semangka", correct: false}, {text: "Melon", correct: false}] },
                { img: "📏", text: "Manakah benda yang ukurannya paling panjang di kelas?", options: [{text: "Penggaris Panjang", correct: true}, {text: "Penghapus Karet", correct: false}, {text: "Koin Logam", correct: false}] },
                { img: "🏢", text: "Manakah bangunan yang posisi tingginya paling menjulang?", options: [{text: "Gedung Pencakar Langit", correct: true}, {text: "Rumah Tinggal", correct: false}, {text: "Tenda Kemping", correct: false}] },
                { img: "🪶", text: "Benda manakah yang rasanya paling ringan ketika dipegang?", options: [{text: "Sehelai Bulu Burung", correct: true}, {text: "Batu Bata Merah", correct: false}, {text: "Tas Penuh Buku", correct: false}] },
                { img: "🦒", text: "Hewan darat manakah yang memiliki bagian leher paling panjang?", options: [{text: "Jerapah", correct: true}, {text: "Kucing", correct: false}, {text: "Tikus", correct: false}] },
                { img: "🐳", text: "Hewan air manakah yang memiliki ukuran tubuh paling raksasa?", options: [{text: "Paus Biru", correct: true}, {text: "Ikan Hias", correct: false}, {text: "Kepiting", correct: false}] }
            ]);
        }

        function getMewarnaiBank() {
            return shuffleArray([
                { img: "🎨", text: "Pencampuran warna merah dengan warna kuning akan menghasilkan warna...", options: [{text: "Oranye / Jingga", correct: true}, {text: "Hijau", correct: false}, {text: "Ungu", correct: false}] },
                { img: "🎨", text: "Pencampuran warna biru dengan warna kuning akan menghasilkan warna...", options: [{text: "Hijau", correct: true}, {text: "Merah", correct: false}, {text: "Pink", correct: false}] },
                { img: "🪵", text: "Biasanya anak-anak menggunakan warna apa untuk mewarnai batang pohon?", options: [{text: "Cokelat", correct: true}, {text: "Biru Muda", correct: false}, {text: "Merah Muda", correct: false}] },
                { img: "🎨", text: "Manakah yang termasuk kelompok warna primer (utama) dalam seni?", options: [{text: "Merah, Kuning, Biru", correct: true}, {text: "Ungu, Pink, Cokelat", correct: false}, {text: "Emas, Perak, Perunggu", correct: false}] },
                { img: "☁️", text: "Warna yang paling pas untuk mewarnai gumpalan awan di siang cerah adalah...", options: [{text: "Putih / Biru Muda", correct: true}, {text: "Hitam Pekat", correct: false}, {text: "Merah Menyala", correct: false}] },
                { img: "🎨", text: "Pencampuran warna merah dan biru dalam seni lukis akan menjadi warna...", options: [{text: "Ungu", correct: true}, {text: "Hijau", correct: false}, {text: "Kuning", correct: false}] }
            ]);
        }

        function getHewanBank() {
            return shuffleArray([
                { img: "🐠", text: "Hewan apakah yang hidup di dalam air dan bernapas menggunakan insang?", options: [{text: "Ikan", correct: true}, {text: "Kucing", correct: false}, {text: "Burung", correct: false}] },
                { img: "🦅", text: "Hewan manakah yang mempunyai sayap dan bisa terbang tinggi di udara?", options: [{text: "Burung", correct: true}, {text: "Sapi", correct: false}, {text: "Kuda", correct: false}] },
                { img: "🐱", text: "Suara 'meong... meong...' adalah suara khas dari hewan...", options: [{text: "Kucing", correct: true}, {text: "Anjing", correct: false}, {text: "Bebek", correct: false}] },
                { img: "🦒", text: "Satwa liar berleher panjang pemakan daun pucuk pohon adalah...", options: [{text: "Jerapah", correct: true}, {text: "Kelinci", correct: false}, {text: "Tikus", correct: false}] },
                { img: "🐄", text: "Hewan ternak berkaki empat yang menghasilkan susu sehat adalah...", options: [{text: "Sapi", correct: true}, {text: "Singa", correct: false}, {text: "Buaya", correct: false}] },
                { img: "🐒", text: "Hewan cerdas yang suka bergelantungan di pohon dan suka pisang yaitu...", options: [{text: "Monyet", correct: true}, {text: "Ikan", correct: false}, {text: "Kura-kura", correct: false}] },
                { img: "🦆", text: "Unggas air berkaki dua yang berbunyi 'kwek kwek' adalah...", options: [{text: "Bebek", correct: true}, {text: "Kambing", correct: false}, {text: "Kelinci", correct: false}] },
                { img: "🦁", text: "Hewan buas yang dijuluki sebagai raja hutan adalah...", options: [{text: "Singa", correct: true}, {text: "Kelinci", correct: false}, {text: "Rusa", correct: false}] }
            ]);
        }

        function getTumbuhanBank() {
            return shuffleArray([
                { img: "🌱", text: "Bagian tumbuhan yang tertanam di dalam tanah untuk menyerap air adalah...", options: [{text: "Akar", correct: true}, {text: "Daun", correct: false}, {text: "Bunga", correct: false}] },
                { img: "🌿", text: "Bagian tumbuhan berwarn hijau yang berfungsi memasak makanan disebut...", options: [{text: "Daun", correct: true}, {text: "Akar", correct: false}, {text: "Batang", correct: false}] },
                { img: "🌳", text: "Bagian kokoh tumbuhan yang berfungsi menegakkan dahan dan ranting yaitu...", options: [{text: "Batang", correct: true}, {text: "Bunga", correct: false}, {text: "Buah", correct: false}] },
                { img: "🌻", text: "Bagian tumbuhan yang berbau harum dan memiliki mahkota indah adalah...", options: [{text: "Bunga", correct: true}, {text: "Akar", correct: false}, {text: "Tanah", correct: false}] },
                { img: "🍎", text: "Bagian tumbuhan tempat menyimpan cadangan makanan manis yang bisa dimakan...", options: [{text: "Buah", correct: true}, {text: "Dahan", correct: false}, {text: "Akar", correct: false}] }
            ]);
        }

        function getInggrisBank() {
            return shuffleArray([
                { img: "🔴", text: "Apakah terjemahan bahasa Inggris dari warna merah?", options: [{text: "Red", correct: true}, {text: "Blue", correct: false}, {text: "Green", correct: false}] },
                { img: "🔟", text: "Apakah bahasa Inggris dari angka sepuluh?", options: [{text: "Ten", correct: true}, {text: "Five", correct: false}, {text: "One", correct: false}] },
                { img: "🐈", text: "Apa arti kata 'cat' dalam bahasa Indonesia?", options: [{text: "Kucing", correct: true}, {text: "Anjing", correct: false}, {text: "Kelinci", correct: false}] },
                { img: "🍎", text: "Apa arti kata 'apple' dalam bahasa Indonesia?", options: [{text: "Apel", correct: true}, {text: "Pisang", correct: false}, {text: "Jeruk", correct: false}] },
                { img: "☀️", text: "Apakah bahasa Inggris dari matahari pagi?", options: [{text: "Sun", correct: true}, {text: "Moon", correct: false}, {text: "Star", correct: false}] },
                { img: "💧", text: "Apakah bahasa Inggris untuk air minum?", options: [{text: "Water", correct: true}, {text: "Fire", correct: false}, {text: "Milk", correct: false}] },
                { img: "🐶", text: "Apakah bahasa Inggris untuk hewan anjing?", options: [{text: "Dog", correct: true}, {text: "Cat", correct: false}, {text: "Bird", correct: false}] },
                { img: "🏫", text: "Apakah bahasa Inggris untuk tempat sekolah?", options: [{text: "School", correct: true}, {text: "House", correct: false}, {text: "Hospital", correct: false}] }
            ]);
        }

        function startQuiz(category) {
            let pool = [];
            if (category === 'angka') {
                pool = getAngkaBank();
                totalQuestionsCount = 10;
            } else if (category === 'hitung') {
                pool = getHitungBank();
                totalQuestionsCount = 10;
            } else if (category === 'bentuk') {
                pool = getBentukBank();
                totalQuestionsCount = 10;
            } else if (category === 'pola') {
                pool = getPolaBank();
                totalQuestionsCount = 10;
            } else if (category === 'konsep') {
                pool = getKonsepBank();
                totalQuestionsCount = 10;
            } else if (category === 'mewarnai') {
                pool = getMewarnaiBank();
                totalQuestionsCount = 10;
            } else if (category === 'hewan') {
                pool = getHewanBank();
                totalQuestionsCount = 10;
            } else if (category === 'tumbuhan') {
                pool = getTumbuhanBank();
                totalQuestionsCount = 10;
            } else if (category === 'inggris') {
                pool = getInggrisBank();
                totalQuestionsCount = 10;
            } else if (category === 'semua') {
                let mixPool = [
                    ...shuffleArray(getAngkaBank()).slice(0, 3),
                    ...shuffleArray(getHitungBank()).slice(0, 3),
                    ...shuffleArray(getBentukBank()).slice(0, 2),
                    ...shuffleArray(getPolaBank()).slice(0, 2),
                    ...shuffleArray(getKonsepBank()).slice(0, 2),
                    ...shuffleArray(getMewarnaiBank()).slice(0, 2),
                    ...shuffleArray(getHewanBank()).slice(0, 2),
                    ...shuffleArray(getTumbuhanBank()).slice(0, 2),
                    ...shuffleArray(getInggrisBank()).slice(0, 2)
                ];
                pool = shuffleArray(mixPool);
                totalQuestionsCount = pool.length;
            }

            if (category !== 'semua') {
                currentQuestions = getUniqueQuestions(pool, totalQuestionsCount);
            } else {
                currentQuestions = pool;
            }

            currentIndex = 0;
            score = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('question-progress').innerText = `Soal ${currentIndex + 1} dari ${totalQuestionsCount}`;
            document.getElementById('score-tracker').innerText = `🏆 Skor: ${score}`;
            
            document.getElementById('question-image').innerText = q.img;
            document.getElementById('question-text').innerText = q.text;

            speakText(q.text);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            // Mengacak urutan opsi jawaban menggunakan properti objek 'correct' yang aman
            let shuffledOpts = shuffleArray(q.options);

            shuffledOpts.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white/90 hover:bg-white border-2 border-indigo-100 hover:border-indigo-400 font-bold py-3.5 px-4 rounded-2xl shadow-sm transition-all transform hover:scale-[1.01] active:scale-95 text-slate-700 flex items-center gap-3.5 text-base md:text-lg";
                btn.innerHTML = `<span class="w-8 h-8 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm font-extrabold shadow-sm">${String.fromCharCode(65 + index)}</span> <span>${item.text}</span>`;
                
                btn.onclick = () => {
                    playSound('click');
                    selectOption(item.correct, index, shuffledOpts);
                };
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(isCorrect, selectedIndex, optionsList) {
            const options = document.getElementById('options-container').children;
            const feedback = document.getElementById('feedback-container');
            
            for (let i = 0; i < options.length; i++) {
                options[i].disabled = true;
                if (optionsList[i].correct) {
                    options[i].classList.remove('bg-white/90', 'border-indigo-100');
                    options[i].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'shadow-md');
                } else if (i === selectedIndex && !isCorrect) {
                    options[i].classList.remove('bg-white/90', 'border-indigo-100');
                    options[i].classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                }
            }

            const pointsPerQuestion = Math.round(100 / totalQuestionsCount);
            if (isCorrect) {
                playSound('correct');
                score += pointsPerQuestion;
                feedback.className = "mb-3 p-3 rounded-2xl text-center font-bold text-base bg-emerald-100 text-emerald-800 border-2 border-emerald-200 animate-pop";
                feedback.innerText = "🌟 Pintar Sekali! Jawabanmu Benar! 🎉";
                speakText("Benar, hebat sekali!");
            } else {
                playSound('wrong');
                feedback.className = "mb-3 p-3 rounded-2xl text-center font-bold text-base bg-rose-100 text-rose-800 border-2 border-emerald-200 animate-pop";
                feedback.innerText = "💪 Belum Tepat, Yuk Coba Lagi di Soal Berikutnya!";
                speakText("Belum tepat, ayo coba lagi!");
            }

            feedback.classList.add('block');
            feedback.classList.remove('hidden');
            document.getElementById('score-tracker').innerText = `🏆 Skor: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                playSound('correct');
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score-text').innerText = `Hebat! Total skor akhirmu adalah ${score} dari 100. Semangat belajarnya ya!`;
                speakText("Luar biasa! Kamu telah menyelesaikan semua latihan hari ini.");
            }
        }

        function resetQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
