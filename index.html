    <script>
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let totalQuestionsCount = 10;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function speakText(text, lang = 'id-ID') {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentQuestion() {
            const q = currentQuestions[currentIndex];
            speakText(q.spokenText || q.text, q.isEnglish ? 'en-US' : 'id-ID');
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getUniqueQuestions(pool, count) {
            let uniqueMap = new Map();
            for (let item of pool) {
                if (!uniqueMap.has(item.text)) {
                    uniqueMap.set(item.text, item);
                }
            }
            let uniqueList = Array.from(uniqueMap.values());
            let shuffled = shuffleArray(uniqueList);
            return shuffled.slice(0, Math.min(count, shuffled.length));
        }

        function numberToEnglish(num) {
            const units = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
            const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
            
            if (num < 20) return units[num];
            if (num < 100) {
                let t = Math.floor(num / 10);
                let u = num % 10;
                return u === 0 ? tens[t] : `${tens[t]} ${units[u]}`;
            }
            if (num === 100) return "one hundred";
            if (num < 200) {
                let rem = num - 100;
                return rem === 0 ? "one hundred" : `one hundred ${numberToEnglish(rem)}`;
            }
            return num.toString();
        }

        // --- 3. ANGKA & HITUNG BENDA (15+ Soal) ---
        function getAngkaBank() {
            let list = [];
            let icons = ['🌟', '🍎', '🚗', '🎈', '🐶', '⚽', '🐱', '🍌', '🌸', '🐟'];
            for (let i = 1; i <= 20; i++) {
                let icon = icons[(i * 3) % icons.length];
                let count = (i % 12) + 1;
                let stringBenda = Array(count).fill(icon).join(' ');
                let correctVal = count;
                let w1 = correctVal === 15 ? 12 : correctVal + 2;
                let w2 = Math.max(1, correctVal - 2);
                if (w1 === correctVal) w1 = correctVal + 1;
                list.push({ 
                    img: stringBenda, 
                    text: `Hitunglah berapa jumlah total benda ${icon} pada kelompok gambar di atas?`, 
                    options: [
                        { text: correctVal.toString(), correct: true },
                        { text: w1.toString(), correct: false },
                        { text: w2.toString(), correct: false }
                    ] 
                });
            }
            return shuffleArray(list);
        }

                { img: "🌵", text: "Tanaman unik tahan panas di gurun pasir yang batangnya berduri dan menyimpan air adalah...", options: [{text: "Kaktus", correct: true}, {text: "Pohon Pisang", correct: false}, {text: "Pohon Padi", correct: false}] },
                { img: "🌾", text: "Tanaman biji-bijian di sawah yang menjadi sumber makanan pokok nasi bagi kita adalah...", options: [{text: "Padi", correct: true}, {text: "Rumput liar", correct: false}, {text: "Bambu", correct: false}] }
            ]);
        }

        // --- 12. KOSAKATA BAHASA INGGRIS DASAR (10+ Soal) ---
        function getInggrisBank() {
            return shuffleArray([
                { img: "🔵", text: "Apakah terjemahan bahasa Inggris dari warna biru?", options: [{text: "Blue", correct: true}, {text: "Red", correct: false}, {text: "Yellow", correct: false}] },
                { img: "5️⃣", text: "Apakah bahasa Inggris dari angka lima?", options: [{text: "Five", correct: true}, {text: "Ten", correct: false}, {text: "One", correct: false}] },
                { img: "🐶", text: "Apa arti kosakata bahasa Inggris 'dog' dalam bahasa Indonesia?", options: [{text: "Anjing", correct: true}, {text: "Kucing", correct: false}, {text: "Kelinci", correct: false}] },
                { img: "🐱", text: "Apa terjemahan bahasa Inggris dari hewan kucing?", options: [{text: "Cat", correct: true}, {text: "Dog", correct: false}, {text: "Bird", correct: false}] },
                { img: "🍎", text: "Apa arti kosakata bahasa Inggris 'apple' dalam bahasa Indonesia?", options: [{text: "Apel", correct: true}, {text: "Pisang", correct: false}, {text: "Jeruk", correct: false}] },
                { img: "☀️", text: "Apa terjemahan bahasa Inggris dari matahari?", options: [{text: "Sun", correct: true}, {text: "Moon", correct: false}, {text: "Star", correct: false}] },
                { img: "🔴", text: "Apakah bahasa Inggris dari warna merah?", options: [{text: "Red", correct: true}, {text: "Blue", correct: false}, {text: "Green", correct: false}] },
                { img: "🌳", text: "Apa arti kosakata bahasa Inggris 'tree'?", options: [{text: "Pohon", correct: true}, {text: "Bunga", correct: false}, {text: "Rumput", correct: false}] },
                { img: "🚗", text: "Apa terjemahan bahasa Inggris dari mobil?", options: [{text: "Car", correct: true}, {text: "Bike", correct: false}, {text: "Bus", correct: false}] },
                { img: "🏫", text: "Apa arti kosakata bahasa Inggris 'school'?", options: [{text: "Sekolah", correct: true}, {text: "Rumah", correct: false}, {text: "Taman", correct: false}] }
            ]);
        }

        function startQuiz(category) {
            let pool = [];
            if (category === 'hitung_gambar') {
                pool = getHitungGambarBank();
                totalQuestionsCount = 20;
            } else if (category === 'olimpiade_tk') {
                pool = getOlimpiadeTKBank();
                totalQuestionsCount = 10;
            } else if (category === 'angka') {
                pool = getAngkaBank();
                totalQuestionsCount = 10;
            } else if (category === 'hitung') {
                pool = getHitungBank();
                totalQuestionsCount = 10;
            } else if (category === 'math_eng') {
                pool = getMathEnglishBank();
                totalQuestionsCount = 10;
            } else if (category === 'bentuk') {
                pool = getBentukBank();
                totalQuestionsCount = 10;
            } else if (category === 'pola') {
                pool = getPolaBank();
                totalQuestionsCount = 10;
            } else if (category === 'konsep') {
                pool = getKonsepBank();
                totalQuestionsCount = 10;
            } else if (category === 'mewarnai') {
                pool = getMewarnaiBank();
                totalQuestionsCount = 10;
            } else if (category === 'hewan') {
                pool = getHewanBank();
                totalQuestionsCount = 10;
            } else if (category === 'tumbuhan') {
                pool = getTumbuhanBank();
                totalQuestionsCount = 10;
            } else if (category === 'inggris') {
                pool = getInggrisBank();
                totalQuestionsCount = 10;
            } else if (category === 'semua') {
                let mixPool = [
                    ...shuffleArray(getHitungGambarBank()).slice(0, 4),
                    ...shuffleArray(getOlimpiadeTKBank()).slice(0, 3),
                    ...shuffleArray(getMathEnglishBank()).slice(0, 3),
                    ...shuffleArray(getHitungBank()).slice(0, 3),
                    ...shuffleArray(getBentukBank()).slice(0, 2),
                    ...shuffleArray(getPolaBank()).slice(0, 2),
                    ...shuffleArray(getHewanBank()).slice(0, 1),
                    ...shuffleArray(getInggrisBank()).slice(0, 2)
                ];
                pool = shuffleArray(mixPool);
                totalQuestionsCount = 20;
            }

            currentQuestions = getUniqueQuestions(pool, totalQuestionsCount);
            currentIndex = 0;
            score = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('question-progress').innerText = `Soal ${currentIndex + 1} dari ${totalQuestionsCount}`;
            document.getElementById('score-tracker').innerText = `🏆 Skor: ${score}`;
            
            document.getElementById('question-image').innerText = q.img;
            document.getElementById('question-text').innerText = q.text;

            speakText(q.spokenText || q.text, q.isEnglish ? 'en-US' : 'id-ID');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            let shuffledOpts = shuffleArray(q.options);

            shuffledOpts.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white/90 hover:bg-white border-2 border-indigo-100 hover:border-indigo-400 font-bold py-3.5 px-4 rounded-2xl shadow-sm transition-all transform hover:scale-[1.01] active:scale-95 text-slate-700 flex items-center gap-3.5 text-base md:text-lg";
                btn.innerHTML = `<span class="w-8 h-8 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm font-extrabold shadow-sm">${String.fromCharCode(65 + index)}</span> <span>${item.text}</span>`;
                
                btn.onclick = () => {
                    playSound('click');
                    selectOption(item.correct, index, shuffledOpts);
                };
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(isCorrect, selectedIndex, optionsList) {
            const options = document.getElementById('options-container').children;
            const feedback = document.getElementById('feedback-container');
            const q = currentQuestions[currentIndex];
            
            for (let i = 0; i < options.length; i++) {
                options[i].disabled = true;
                if (optionsList[i].correct) {
                    options[i].classList.remove('bg-white/90', 'border-indigo-100');
                    options[i].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'shadow-md');
                } else if (i === selectedIndex && !isCorrect) {
                    options[i].classList.remove('bg-white/90', 'border-indigo-100');
                    options[i].classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                }
            }

            const pointsPerQuestion = Math.round(100 / totalQuestionsCount);
            if (isCorrect) {
                playSound('correct');
                score += pointsPerQuestion;
                feedback.className = "mb-3 p-3 rounded-2xl text-center font-bold text-base bg-emerald-100 text-emerald-800 border-2 border-emerald-200 animate-pop";
                feedback.innerText = "🌟 Pintar Sekali! Jawabanmu Benar! 🎉";
                if (q.isEnglish) {
                    speakText("Correct, great job!", "en-US");
                } else {
                    speakText("Benar, hebat sekali!");
                }
            } else {
                playSound('wrong');
                feedback.className = "mb-3 p-3 rounded-2xl text-center font-bold text-base bg-rose-100 text-rose-800 border-2 border-emerald-200 animate-pop";
                feedback.innerText = "💪 Belum Tepat, Yuk Coba Lagi di Soal Berikutnya!";
                if (q.isEnglish) {
                    speakText("Incorrect, try again!", "en-US");
                } else {
                    speakText("Belum tepat, ayo coba lagi!");
                }
            }

            feedback.classList.add('block');
            feedback.classList.remove('hidden');
            document.getElementById('score-tracker').innerText = `🏆 Skor: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                playSound('correct');
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score-text').innerText = `Hebat! Total skor akhirmu adalah ${score} dari 100. Calon juara masa depan!`;
                speakText("Luar biasa! Kamu telah menyelesaikan semua latihan hari ini.");
            }
        }

        function resetQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
</body>
