            {q: "Seseorang yang membuat peta wilayah suatu daerah:", "a": "Ahli geografi / Kartografer", "w1": "Montir", "w2": "Nelayan"},
            {q: "Orang yang bekerja sebagai pengelola hotel berbintang:", "a": "Manajer hotel", "w1": "Petani", "w2": "Arsitek"},
            {q: "Seseorang yang melayani tamu di kamar restoran hotel:", "a": "Pelayan / Waiter", "w1": "Guru", "w2": "Koki"},
            {q: "Orang yang mengoperasikan mesin pabrik tekstil:", "a": "Operator pabrik", "w1": "Dokter", "w2": "Pilot"},
            {q: "Seseorang yang membuat perhiasan emas dan permata:", "a": "Pembuat perhiasan / Jeweler", "w1": "Polisi", "w2": "Nelayan"},
            {q: "Orang yang menempah besi membara di bengkel besi:", "a": "Pandai besi", "w1": "Guru", "w2": "Montir"},
            {q: "Seseorang yang meneliti cuaca di badan meteorologi:", "a": "Ahli meteorologi", "w1": "Koki", "w2": "Arsitek"},
            {q: "Orang yang memimpin kapal laut besar sebagai kapten:", "a": "Kapten kapal", "w1": "Dokter", "w2": "Petani"},
            {q: "Seseorang yang bekerja sebagai teknisi pesawat terbang:", "a": "Teknisi pesawat", "w1": "Nelayan", "w2": "Polisi"},
            {q: "Orang yang merancang mode pakaian di butik terkenal:", "a": "Desainer mode / Perancang", "w1": "Montir", "w2": "Guru"},
            {q: "Seseorang yang bekerja sebagai pengawas mutu pabrik:", "a": "Quality Control", "w1": "Koki", "w2": "Pilot"},
            {q: "Orang yang menguji keamanan sistem komputer digital:", "a": "Ahli keamanan siber", "w1": "Dokter", "w2": "Nelayan"},
            {q: "Seseorang yang bekerja sebagai penyedia jasa katering makanan:", "a": "Pengusaha katering", "w1": "Petani", "w2": "Arsitek"},
            {q: "Orang yang berjuang membela negara sebagai prajurit tentara:", "a": "Tentara / Prajurit", "w1": "Guru", "w2": "Polisi"}
        ];

        function generate100UniqueQuestions(type) {
            let pool = [];
            for (let i = 1; i <= 100; i++) {
                let qText = "", speakTextContent = "", ans = "", w1 = "", w2 = "", img = "🏆";

                if (type === 'olimpiade') {
                    let a = (i * 13) % 85 + 20;
                    let b = (i * 7) % 75 + 15;
                    let total = a + b;
                    ans = total.toString();
                    w1 = (total + 3).toString();
                    w2 = (total - 4).toString();
                    qText = `Berapakah hasil dari ${a} + ${b} ?`;
                    speakTextContent = `Berapakah hasil dari ${a} ditambah ${b}?`;
                    img = "🏆";
                } else if (type === 'hitung') {
                    if (i % 2 === 0) {
                        let a = (i * 17) % 180 + 30;
                        let b = (i * 9) % 130 + 20;
                        let total = a + b;
                        ans = total.toString();
                        w1 = (total + 5).toString();
                        w2 = (total - 3).toString();
                        qText = `Berapa ${a} + ${b} ?`;
                        speakTextContent = `Berapa ${a} ditambah ${b}?`;
                    } else {
                        let a = (i * 19) % 250 + 80;
                        let b = (i * 6) % 95 + 15;
                        let total = a - b;
                        ans = total.toString();
                        w1 = (total + 4).toString();
                        w2 = (total - 6).toString();
                        qText = `Berapa ${a} - ${b} ?`;
                        speakTextContent = `Berapa ${a} dikurangi ${b}?`;
                    }
                    img = "➕";
                } else if (type === 'pola') {
                    let start = (i * 3) % 25 + 4;
                    let step = (i % 4) + 2;
                    let n4 = start + (step * 3);
                    ans = n4.toString();
                    w1 = (n4 + step).toString();
                    w2 = (n4 - step).toString();
                    qText = `Lanjutkan deret angka: ${start}, ${start+step}, ${start+(step*2)}, ...`;
                    speakTextContent = `Lanjutkan deret angka ${start}, ${start+step}, ${start+(step*2)}`;
                    img = "🧩";
                } else if (type === 'sains') {
                    let item = sainsData100[(i - 1) % sainsData100.length];
                    qText = item.q;
                    speakTextContent = item.q;
                    ans = item.a;
                    w1 = item.w1;
                    w2 = item.w2;
                    img = "🌱";
                } else if (type === 'hewan') {
                    let item = hewanData100[(i - 1) % hewanData100.length];
                    qText = item.q;
                    speakTextContent = item.q;
                    ans = item.a;
                    w1 = item.w1;
                    w2 = item.w2;
                    img = "🦁";
                } else if (type === 'profesi') {
                    let item = profesiData100[(i - 1) % profesiData100.length];
                    qText = item.q;
                    speakTextContent = item.q;
                    ans = item.a;
                    w1 = item.w1;
                    w2 = item.w2;
                    img = "👨‍⚕️";
                }

                pool.push({
                    img: img,
                    text: qText,
                    spokenText: speakTextContent,
                    options: shuffleArray([{text: ans, correct: true}, {text: w1, correct: false}, {text: w2, correct: false}])
                });
            }
            return pool;
        }

        function speakBilingual(enText, idText) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterEn = new SpeechSynthesisUtterance(enText);
                utterEn.lang = 'en-US';
                utterEn.rate = 0.8;

                let utterId = new SpeechSynthesisUtterance(`Artinya, ${idText}`);
                utterId.lang = 'id-ID';
                utterId.rate = 0.9;

                window.speechSynthesis.speak(utterEn);
                window.speechSynthesis.speak(utterId);
            }
        }

        function speakText(text, lang = 'id-ID') {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startTutor(category) {
            activeTutorArray = category === 'words' ? dbWords100 : dbSentences100;
            currentTutorIndex = 0;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('tutor-screen').classList.remove('hidden');
            loadTutorItem();
        }

        function loadTutorItem() {
            const item = activeTutorArray[currentTutorIndex];
            document.getElementById('tutor-progress').innerText = `Materi ${currentTutorIndex + 1} dari 100`;
            document.getElementById('tutor-emoji').innerText = item.emoji;
            document.getElementById('tutor-en').innerText = item.en;
            document.getElementById('tutor-id').innerText = `Artinya: ${item.id}`;
            document.getElementById('prev-btn').style.display = currentTutorIndex === 0 ? 'none' : 'block';

            speakBilingual(item.en, item.id);
        }

        function speakTutorCurrent() {
            const item = activeTutorArray[currentTutorIndex];
            speakBilingual(item.en, item.id);
        }

        function nextTutorItem() {
            if (currentTutorIndex < 99) {
                currentTutorIndex++;
                loadTutorItem();
            } else {
                alert("Luar biasa! Kamu sudah menuntaskan 100 materi tanpa putus!");
                resetApp();
            }
        }

        function prevTutorItem() {
            if (currentTutorIndex > 0) {
                currentTutorIndex--;
                loadTutorItem();
            }
        }

        function startQuiz(type) {
            currentQuestions = generate100UniqueQuestions(type);
            currentIndex = 0;
            score = 0;
            lives = 3;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            updateLivesDisplay();
            loadQuestion();
        }

        function updateLivesDisplay() {
            let hearts = "";
            for (let i = 0; i < 3; i++) { hearts += i < lives ? "❤️" : "🖤"; }
            document.getElementById('lives-container').innerText = hearts;
        }

        function loadQuestion() {
            if (currentIndex >= currentQuestions.length) {
                showResultScreen();
                return;
            }

            const q = currentQuestions[currentIndex];
            document.getElementById('question-progress').innerText = `Soal ${currentIndex + 1}/100`;
            document.getElementById('score-tracker').innerText = `${score} XP`;
            document.getElementById('progress-bar-fill').style.width = `${((currentIndex)/100)*100}%`;

            document.getElementById('question-image').innerText = q.img;
            document.getElementById('question-text').innerText = q.text;

            speakText(q.spokenText, 'id-ID');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            q.options.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-50 hover:bg-slate-100 border-2 border-slate-200 font-bold py-2.5 px-3 rounded-2xl shadow-sm text-slate-700 flex items-center gap-3 text-xs md:text-sm";
                btn.innerHTML = `<span class="w-6 h-6 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-extrabold">${String.fromCharCode(65 + index)}</span> <span>${item.text}</span>`;
                btn.onclick = () => selectOption(item.correct, index, q.options);
                optionsContainer.appendChild(btn);
            });
        }

        function speakCurrentQuestion() {
            const q = currentQuestions[currentIndex];
            speakText(q.spokenText, 'id-ID');
        }

        function selectOption(isCorrect, selectedIndex, optionsList) {
            const options = document.getElementById('options-container').children;
            const feedback = document.getElementById('feedback-container');
            
            for (let i = 0; i < options.length; i++) {
                options[i].disabled = true;
                if (optionsList[i].correct) options[i].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                else if (i === selectedIndex && !isCorrect) options[i].classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
            }

            if (isCorrect) {
                score += 1;
                feedback.className = "p-2 rounded-xl text-center font-bold text-xs bg-emerald-100 text-emerald-800";
                feedback.innerText = "🌟 Benar sekali! +1 XP";
                speakText("Benar!", 'id-ID');
            } else {
                lives = Math.max(0, lives - 1);
                updateLivesDisplay();
                feedback.className = "p-2 rounded-xl text-center font-bold text-xs bg-rose-100 text-rose-800";
                feedback.innerText = "💪 Belum Tepat!";
                speakText("Belum tepat", 'id-ID');
            }

            feedback.classList.remove('hidden');
            document.getElementById('score-tracker').innerText = `${score} XP`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < 100 && lives > 0) {
                loadQuestion();
            } else {
                showResultScreen();
            }
        }

        function showResultScreen() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            speakText("Misi selesai! Kamu hebat!", 'id-ID');
        }

        function resetApp() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('tutor-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            switchTab('english');
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
    </script>
