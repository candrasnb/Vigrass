<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dunia Belajar Anak Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', cursive, sans-serif; }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-float { animation: floatSlow 4s ease-in-out infinite; }
        .animate-pop { animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="bg-gradient-to-tr from-violet-900 via-indigo-800 to-blue-900 min-h-screen flex items-center justify-center p-4 text-slate-800 relative overflow-x-hidden">

    <!-- Background Glow -->
    <div class="absolute top-10 left-10 w-32 h-32 bg-pink-500/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-40 h-40 bg-cyan-400/30 rounded-full blur-3xl pointer-events-none"></div>

    <div class="bg-white/95 backdrop-blur-2xl rounded-[2.5rem] shadow-2xl p-5 md:p-8 w-full max-w-lg border-4 border-white/60 animate-pop relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <div class="inline-block bg-gradient-to-r from-amber-400 to-orange-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 shadow-sm animate-float">
                ✨ Akademi Cerdas Si Kecil ✨
            </div>
            <h1 class="text-xl md:text-2xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent leading-tight">
                Dunia Belajar Anak Cerdas – Main Sambil Berhitung & Menjelajah 🌍
            </h1>
            <p class="text-slate-500 text-sm mt-1">Pilih petualangan belajarmu hari ini!</p>
        </div>

        <!-- Setup Screen -->
        <div id="setup-screen" class="space-y-2.5 max-h-[72vh] overflow-y-auto pr-1">
            <div class="bg-indigo-50 p-3 rounded-2xl border-2 border-indigo-100 text-center shadow-inner">
                <p class="text-indigo-900 font-bold text-sm">Pilih kategori latihan:</p>
            </div>
            <div class="grid grid-cols-1 gap-2.5">
                <button onclick="playSound('click'); startQuiz('semua')" class="w-full bg-gradient-to-r from-fuchsia-600 to-pink-600 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🌟 Semua Materi (Campuran)</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">20 Soal Unik</span>
                </button>
                <button onclick="playSound('click'); startQuiz('angka')" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🔢 Pengenalan Angka 1–20</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">10 Soal Unik</span>
                </button>
                <button onclick="playSound('click'); startQuiz('hitung')" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>➕ Penjumlahan & Pengurangan Rapi</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">10 Soal Unik</span>
                </button>
                <button onclick="playSound('click'); startQuiz('bentuk')" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🎨 Mengenal Bentuk & Warna</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">10 Soal Unik</span>
                </button>
                <button onclick="playSound('click'); startQuiz('pola')" class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🧩 Pola Urutan (Pattern)</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">10 Soal Unik</span>
                </button>
                <button onclick="playSound('click'); startQuiz('konsep')" class="w-full bg-gradient-to-r from-indigo-500 to-violet-600 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🐘 Besar/Kecil & Panjang/Pendek</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">10 Soal Unik</span>
                </button>
                <button onclick="playSound('click'); startQuiz('mewarnai')" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🎨 Materi Mewarnai & Seni</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">10 Soal Unik</span>
                </button>
                <button onclick="playSound('click'); startQuiz('hewan')" class="w-full bg-gradient-to-r from-yellow-600 to-amber-600 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🦁 Mengenal Hewan</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">10 Soal Unik</span>
                </button>
                <button onclick="playSound('click'); startQuiz('tumbuhan')" class="w-full bg-gradient-to-r from-green-600 to-emerald-700 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🌱 Mengenal Tumbuhan</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">10 Soal Unik</span>
                </button>
                <button onclick="playSound('click'); startQuiz('inggris')" class="w-full bg-gradient-to-r from-blue-600 to-sky-600 text-white font-bold py-3 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">
                    <span>🔤 Belajar Bahasa Inggris</span>
                    <span class="text-xs bg-white/25 px-2.5 py-1 rounded-xl">10 Soal Unik</span>
                </button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden relative z-10 animate-pop">
            <div class="flex justify-between items-center mb-3 text-sm font-bold text-slate-500">
                <span id="question-progress" class="bg-slate-100 px-3.5 py-1 rounded-full shadow-sm">Soal 1 dari 10</span>
                <div class="flex gap-2">
                    <button onclick="speakCurrentQuestion()" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full shadow-sm hover:bg-indigo-200 text-xs font-extrabold flex items-center gap-1">🔊 Dengar Soal</button>
                    <span id="score-tracker" class="bg-amber-100 text-amber-800 px-3.5 py-1 rounded-full shadow-sm">🏆 Skor: 0</span>
                </div>
            </div>

            <!-- Card Soal Bergambar -->
            <div id="question-card" class="bg-gradient-to-br from-indigo-50/90 to-purple-50/90 p-4 rounded-3xl border-2 border-indigo-200 mb-4 flex flex-col items-center justify-center text-center shadow-inner min-h-[130px]">
                <div id="question-image" class="text-4xl md:text-5xl mb-2 animate-float"></div>
                <h2 id="question-text" class="text-base md:text-lg font-bold text-slate-800 leading-snug">Pertanyaan...</h2>
            </div>

            <!-- Pilihan Ganda -->
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-4"></div>

            <div id="feedback-container" class="hidden mb-3 p-3 rounded-2xl text-center font-bold text-sm md:text-base shadow-md animate-pop"></div>

            <button id="next-btn" onclick="playSound('click'); nextQuestion()" class="hidden w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-lg text-base transition transform hover:scale-[1.01] active:scale-95">
                Soal Berikutnya ➡️
            </button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center space-y-4 relative z-10 animate-pop py-6">
            <div class="text-7xl mb-2 animate-float">🎉</div>
            <h2 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Luar Biasa Hebat!</h2>
            <p id="final-score-text" class="text-slate-600 text-base md:text-lg font-semibold">Kamu hebat sudah menyelesaikan sesi latihan ini.</p>
            <div>
                <button onclick="playSound('click'); resetQuiz()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-xl text-base transition transform hover:scale-105 active:scale-95">
                    🔄 Pilih Latihan Lain
                </button>
            </div>
        </div>

    </div>

    <script>
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let totalQuestionsCount = 10;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentQuestion() {
            const q = currentQuestions[currentIndex];
            speakText(q.text);
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getUniqueQuestions(pool, count) {
            let uniqueMap = new Map();
            for (let item of pool) {
                if (!uniqueMap.has(item.text)) {
                    uniqueMap.set(item.text, item);
                }
            }
            let uniqueList = Array.from(uniqueMap.values());
            let shuffled = shuffleArray(uniqueList);
            return shuffled.slice(0, count);
        }

        // --- BANK SOAL BERSIH & MASIF ---

        function getHitungBank() {
            let list = [];
            let cleanNumbers = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 600, 700, 800, 900, 1000];
            
            for (let a of cleanNumbers) {
                for (let b of cleanNumbers) {
                    let hasil = a + b;
                    let w1 = hasil + 50;
                    let w2 = Math.max(50, hasil - 50);
                    list.push({ img: "🧮", text: `Berapa hasil dari ${a} ditambah ${b}?`, opts: [hasil.toString(), w1.toString(), w2.toString()], corr: 0 });
                }
            }

            for (let i = 1; i <= 9; i++) {
                for (let j = 1; j <= 9; j++) {
                    let a = i * 10;
                    let b = j * 10;
                    let hasil = a + b;
                    let w1 = hasil + 10;
                    let w2 = Math.max(10, hasil - 10);
                    list.push({ img: "➕", text: `Berapa hasil dari ${a} ditambah ${b}?`, opts: [hasil.toString(), w1.toString(), w2.toString()], corr: 0 });
                }
            }

            return shuffleArray(list);
        }

        function getAngkaBank() {
            let list = [];
            let icons = ['⭐', '🍎', '🚗', '🎈', '🐶', '⚽', '🐱', '🍌', '🌸', '🍭'];
            
            for (let i = 1; i <= 20; i++) {
                for (let icon of icons) {
                    let stringBenda = Array(i).fill(icon).join(' ');
                    let w1 = i === 20 ? 18 : i + 1;
                    let w2 = Math.max(1, i - 1);
                    list.push({ img: stringBenda, text: `Berapa jumlah benda berikut?`, opts: [i.toString(), w1.toString(), w2.toString()], corr: 0 });
                }
            }

            for (let i = 2; i <= 19; i++) {
                list.push({ img: `🔢`, text: `Angka berapa yang terletak tepat sesudah angka ${i}?`, opts: [(i+1).toString(), i.toString(), (i-1).toString()], corr: 0 });
                list.push({ img: `🔢`, text: `Angka berapa yang terletak tepat sebelum angka ${i}?`, opts: [(i-1).toString(), (i+1).toString(), (i+2).toString()], corr: 0 });
            }

            return shuffleArray(list);
        }

        function getBentukBank() {
            let list = [
                { img: "🔵", text: "Roda sepeda dan kelereng memiliki bentuk dasar...", opts: ["Lingkaran", "Segitiga", "Persegi"], corr: 0 },
                { img: "📖", text: "Buku tulis dan papan tulis di kelas biasanya berbentuk...", opts: ["Persegi Panjang", "Lingkaran", "Tabung"], corr: 0 },
                { img: "⛺", text: "Atap rumah atau tenda perkemahan umumnya menyerupai bentuk...", opts: ["Segitiga", "Kotak", "Lingkaran"], corr: 0 },
                { img: "🍃", text: "Warna daun yang masih segar dan sehat di pohon adalah...", opts: ["Hijau", "Merah", "Ungu"], corr: 0 },
                { img: "🍌", text: "Warna buah pisang yang sudah matang dan siap dimakan adalah...", opts: ["Kuning", "Hitam", "Biru"], corr: 0 },
                { img: "🍓", text: "Warna buah stroberi yang sudah matang adalah...", opts: ["Merah", "Hijau", "Kuning"], corr: 0 },
                { img: "🧊", text: "Kotak kado atau mainan dadu biasanya berbentuk...", opts: ["Kubus / Persegi", "Lingkaran", "Elips"], corr: 0 },
                { img: "⚽", text: "Bola sepak dan bola basket berbentuk...", opts: ["Bola / Bulat", "Kotak", "Segitiga"], corr: 0 }
            ];
            let expanded = [];
            list.forEach(item => {
                expanded.push({ img: item.img, text: item.text, opts: item.opts, corr: item.corr });
                expanded.push({ img: item.img, text: item.text.replace("...", " yaitu bentuk apa?"), opts: item.opts, corr: item.corr });
            });
            return shuffleArray(expanded);
        }

        function getPolaBank() {
            let list = [
                { img: "🔴 🟦 🔴 🟦", text: "Lanjutkan pola bentuk warna merah dan biru berikut ini.", opts: ["🟦", "🔴", "🟢"], corr: 1 },
                { img: "⭐ 🌙 ⭐ 🌙", text: "Lanjutkan pola bentuk bintang dan bulan berikut ini.", opts: ["🌙", "⭐", "☀️"], corr: 0 },
                { img: "2, 4, 6, 8", text: "Lanjutkan pola angka loncat dua berikut: 2, 4, 6, 8, ...", opts: ["10", "9", "12"], corr: 0 },
                { img: "🐱 🐶 🐱 🐶", text: "Lanjutkan pola hewan kucing dan anjing berikut ini.", opts: ["🐱", "🐶", "🐰"], corr: 1 },
                { img: "🍎 🍌 🍎 🍌", text: "Lanjutkan pola buah apel dan pisang berikut ini.", opts: ["🍎", "🍌", "🍊"], corr: 1 },
                { img: "1, 3, 5, 7", text: "Lanjutkan pola angka ganjil berikut: 1, 3, 5, 7, ...", opts: ["9", "8", "10"], corr: 0 }
            ];
            return shuffleArray(list);
        }

        function getKonsepBank() {
            let list = [
                { img: "🐘", text: "Di antara hewan berikut, manakah yang ukurannya paling besar?", opts: ["Gajah", "Kucing", "Semut"], corr: 0 },
                { img: "🍇", text: "Di antara buah berikut, manakah yang ukurannya paling kecil?", opts: ["Buah Anggur", "Semangka", "Melon"], corr: 0 },
                { img: "📏", text: "Manakah benda yang ukurannya paling panjang?", opts: ["Penggaris panjang", "Penghapus karet", "Koin logam"], corr: 0 },
                { img: "🏢", text: "Manakah bangunan yang posisinya paling tinggi?", opts: ["Gedung Pencakar Langit", "Rumah Tinggal", "Tenda Kemping"], corr: 0 },
                { img: "🪶", text: "Benda manakah yang rasanya paling ringan saat diangkat?", opts: ["Sehelai Bulu Burung", "Batu Bata Merah", "Tas Sekolah Penuh Buku"], corr: 0 }
            ];
            return shuffleArray(list);
        }

        function getMewarnaiBank() {
            let list = [
                { img: "🎨", text: "Warna merah dicampur warna kuning akan menghasilkan warna...", opts: ["Oranye / Jingga", "Hijau", "Ungu"], corr: 0 },
                { img: "🎨", text: "Warna biru dicampur warna kuning akan menghasilkan warna...", opts: ["Hijau", "Merah", "Pink"], corr: 0 },
                { img: "🪵", text: "Untuk mewarnai batang pohon, biasanya anak-anak menggunakan warna...", opts: ["Cokelat", "Biru muda", "Merah muda"], corr: 0 },
                { img: "🎨", text: "Warna primer utama dalam seni rupa adalah...", opts: ["Merah, Kuning, Biru", "Ungu, Pink, Cokelat", "Emas, Perak, Perunggu"], corr: 0 },
                { img: "☁️", text: "Warna yang paling cocok untuk mewarnai awan cerah di langit adalah...", opts: ["Putih / Biru Muda", "Hitam Pekat", "Merah Menyala"], corr: 0 }
            ];
            return shuffleArray(list);
        }

        function getHewanBank() {
            let list = [
                { img: "🐠", text: "Hewan apa yang hidup di air dan bernapas dengan insang?", opts: ["Ikan", "Kucing", "Burung"], corr: 0 },
                { img: "🦅", text: "Hewan manakah yang bisa terbang di udara dengan bebas?", opts: ["Burung", "Sapi", "Kuda"], corr: 0 },
                { img: "🐱", text: "Suara 'meong' adalah suara khas dari hewan...", opts: ["Kucing", "Anjing", "Bebek"], corr: 0 },
                { img: "🦒", text: "Hewan berleher panjang yang suka makan daun pohon tinggi adalah...", opts: ["Jerapah", "Kelinci", "Tikus"], corr: 0 },
                { img: "🐄", text: "Hewan ternak yang menghasilkan susu segar untuk diminum adalah...", opts: ["Sapi", "Singa", "Buaya"], corr: 0 },
                { img: "🐒", text: "Hewan pintar yang menyukai buah pisang dan suka memanjat pohon adalah...", opts: ["Monyet", "Ikan", "Kura-kura"], corr: 0 }
            ];
            return shuffleArray(list);
        }

        function getTumbuhanBank() {
            let list = [
                { img: "🌱", text: "Bagian tumbuhan yang berada di dalam tanah dan menyerap air adalah...", opts: ["Akar", "Daun", "Bunga"], corr: 0 },
                { img: "🌿", text: "Bagian tumbuhan yang umumnya berwarna hijau dan berfungsi memasak makanan adalah...", opts: ["Daun", "Akar", "Batang"], corr: 0 },
                { img: "🌳", text: "Bagian kokoh yang menyangga dahan dan daun tumbuhan disebut...", opts: ["Batang", "Bunga", "Buah"], corr: 0 },
                { img: "🌻", text: "Bagian tumbuhan yang beraroma harum dan biasanya berwarna-warni indah adalah...", opts: ["Bunga", "Akar", "Tanah"], corr: 0 }
            ];
            return shuffleArray(list);
        }

        function getInggrisBank() {
            let list = [
                { img: "🔴", text: "Apa bahasa Inggris dari warna merah?", opts: ["Red", "Blue", "Green"], corr: 0 },
                { img: "🔟", text: "Apa bahasa Inggris dari angka sepuluh?", opts: ["Ten", "Five", "One"], corr: 0 },
                { img: "🐈", text: "Kata 'cat' dalam bahasa Indonesia artinya adalah...", opts: ["Kucing", "Anjing", "Kelinci"], corr: 0 },
                { img: "🍎", text: "Kata 'apple' dalam bahasa Indonesia artinya adalah...", opts: ["Apel", "Pisang", "Jeruk"], corr: 0 },
                { img: "☀️", text: "Apa bahasa Inggris dari matahari?", opts: ["Sun", "Moon", "Star"], corr: 0 },
                { img: "💧", text: "Apa bahasa Inggris dari air minum?", opts: ["Water", "Fire", "Milk"], corr: 0 }
            ];
            return shuffleArray(list);
        }

        function startQuiz(category) {
            let pool = [];
            if (category === 'angka') pool = getAngkaBank();
            else if (category === 'hitung') pool = getHitungBank();
            else if (category === 'bentuk') pool = getBentukBank();
            else if (category === 'pola') pool = getPolaBank();
            else if (category === 'konsep') pool = getKonsepBank();
            else if (category === 'mewarnai') pool = getMewarnaiBank();
            else if (category === 'hewan') pool = getHewanBank();
            else if (category === 'tumbuhan') pool = getTumbuhanBank();
            else if (category === 'inggris') pool = getInggrisBank();
            else if (category === 'semua') {
                pool = [
                    ...getAngkaBank(), ...getHitungBank(), ...getBentukBank(), 
                    ...getPolaBank(), ...getKonsepBank(), ...getMewarnaiBank(), 
                    ...getHewanBank(), ...getTumbuhanBank(), ...getInggrisBank()
                ];
            }

            totalQuestionsCount = (category === 'semua') ? 20 : 10;
            currentQuestions = getUniqueQuestions(pool, totalQuestionsCount);

            currentIndex = 0;
            score = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('question-progress').innerText = `Soal ${currentIndex + 1} dari ${totalQuestionsCount}`;
            document.getElementById('score-tracker').innerText = `🏆 Skor: ${score}`;
            
            document.getElementById('question-image').innerText = q.img;
            document.getElementById('question-text').innerText = q.text;

            speakText(q.text);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            let shuffledOptsWithIndex = q.opts.map((opt, idx) => ({ text: opt, isCorrect: idx === q.corr }));
            shuffledOptsWithIndex = shuffleArray(shuffledOptsWithIndex);

            shuffledOptsWithIndex.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white/90 hover:bg-white border-2 border-indigo-100 hover:border-indigo-400 font-bold py-3.5 px-4 rounded-2xl shadow-sm transition-all transform hover:scale-[1.01] active:scale-95 text-slate-700 flex items-center gap-3.5 text-base md:text-lg";
                btn.innerHTML = `<span class="w-8 h-8 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm font-extrabold shadow-sm">${String.fromCharCode(65 + index)}</span> <span>${item.text}</span>`;
                
                btn.onclick = () => {
                    playSound('click');
                    selectOption(item.isCorrect, index, shuffledOptsWithIndex);
                };
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(isCorrect, selectedIndex, optionsList) {
            const options = document.getElementById('options-container').children;
            const feedback = document.getElementById('feedback-container');
            
            for (let i = 0; i < options.length; i++) {
                options[i].disabled = true;
                if (optionsList[i].isCorrect) {
                    options[i].classList.remove('bg-white/90', 'border-indigo-100');
                    options[i].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'shadow-md');
                } else if (i === selectedIndex && !isCorrect) {
                    options[i].classList.remove('bg-white/90', 'border-indigo-100');
                    options[i].classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                }
            }

            const pointsPerQuestion = Math.round(100 / totalQuestionsCount);
            if (isCorrect) {
                playSound('correct');
                score += pointsPerQuestion;
                feedback.className = "mb-3 p-3 rounded-2xl text-center font-bold text-base bg-emerald-100 text-emerald-800 border-2 border-emerald-200 animate-pop";
                feedback.innerText = "🌟 Pintar Sekali! Jawabanmu Benar! 🎉";
                speakText("Benar, hebat sekali!");
            } else {
                playSound('wrong');
                feedback.className = "mb-3 p-3 rounded-2xl text-center font-bold text-base bg-rose-100 text-rose-800 border-2 border-emerald-200 animate-pop";
                feedback.innerText = "💪 Belum Tepat, Yuk Coba Lagi di Soal Berikutnya!";
                speakText("Belum tepat, ayo coba lagi!");
            }

            feedback.classList.add('block');
            feedback.classList.remove('hidden');
            document.getElementById('score-tracker').innerText = `🏆 Skor: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                playSound('correct');
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score-text').innerText = `Hebat! Total skor akhirmu adalah ${score} dari 100. Semangat belajarnya ya!`;
                speakText("Luar biasa! Kamu telah menyelesaikan semua latihan hari ini.");
            }
        }

        function resetQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
