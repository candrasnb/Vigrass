<!DOCTYPE html>

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }

</head>
<body class="bg-gradient-to-tr from-indigo-950 via-purple-900 to-blue-950 min-h-screen flex items-center justify-center p-4 text-slate-800 relative overflow-x-hidden">

                    <span>🔢 Pengenalan Angka & Hitung Benda Baru</span>

                <button onclick="playSound('click'); startQuiz('hitung')" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">

                <button onclick="playSound('click'); startQuiz('math_eng')" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">

                <button onclick="playSound('click'); startQuiz('hewan')" class="w-full bg-gradient-to-r from-orange-600 to-red-600 text-white font-bold py-3.5 px-5 rounded-2xl shadow-lg transition transform hover:scale-[1.02] active:scale-95 text-left flex justify-between items-center text-sm md:text-base">

        <!-- Quiz Screen -->

            <p id="final-score-text" class="text-slate-600 text-base md:text-lg font-semibold">Kamu hebat sudah menyelesaikan sesi latihan ini.</p>
            <div>
                <button onclick="playSound('click'); resetQuiz()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-90 text-white font-bold py-4 rounded-2xl shadow-xl text-base transition transform hover:scale-105 active:scale-95">

    </div>

    <script>
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let totalQuestionsCount = 10;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.setValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function speakText(text, lang = 'id-ID') {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentQuestion() {
            const q = currentQuestions[currentIndex];
            speakText(q.spokenText || q.text, q.isEnglish ? 'en-US' : 'id-ID');
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getUniqueQuestions(pool, count) {
            let uniqueMap = new Map();
            for (let item of pool) {
                if (!uniqueMap.has(item.text)) {
                    uniqueMap.set(item.text, item);
                }
            }
            let uniqueList = Array.from(uniqueMap.values());
            let shuffled = shuffleArray(uniqueList);
            return shuffled.slice(0, Math.min(count, shuffled.length));
        }

        function numberToEnglish(num) {
            const units = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
            const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
            
            if (num < 20) return units[num];
            if (num < 100) {
                let t = Math.floor(num / 10);
                let u = num % 10;
                return u === 0 ? tens[t] : `${tens[t]} ${units[u]}`;
            }
            if (num === 100) return "one hundred";
            if (num < 200) {
                let rem = num - 100;
                return rem === 0 ? "one hundred" : `one hundred ${numberToEnglish(rem)}`;
            }
            return num.toString();
        }

        // --- KHUSUS: LOMBA MENGHITUNG GAMBAR (Minimal 20 Soal Variatif) ---
        function getHitungGambarBank() {
            let list = [];
            let items = [
                { icon: '🍎', name: 'apel merah' },
                { icon: '⭐', name: 'bintang bersinar' },
                { icon: '🎈', name: 'balon warna-warni' },
                { icon: '🐱', name: 'anak kucing lucu' },
                { icon: '⚽', name: 'bola sepak' },
                { icon: '🚗', name: 'mobil mainan' },
                { icon: '🍦', name: 'es krim manis' },
                { icon: '🐟', name: 'ikan hias' },
                { icon: '🐣', name: 'anak ayam' },
                { icon: '🌸', name: 'bunga cantik' },
                { icon: '🚀', name: 'roket luar angkasa' },
                { icon: '🍭', name: 'permen lolipop' }
            ];

            for (let i = 1; i <= 30; i++) {
                let obj = items[i % items.length];
                let count = (i % 12) + 3;
                let visualString = Array(count).fill(obj.icon).join(' ');
                
                let correctVal = count;
                let wrong1 = correctVal === 15 ? 12 : correctVal + 2;
                let wrong2 = Math.max(1, correctVal - 2);
                if (wrong1 === correctVal) wrong1 = correctVal + 1;

                list.push({
                    img: visualString,
                    text: `Lomba Cepat Tepat: Berapakah jumlah total gambar ${obj.name} di atas?`,
                    spokenText: `Berapa jumlah gambar ${obj.name} di atas?`,
                    options: [
                        { text: `${correctVal} buah`, correct: true },
                        { text: `${wrong1} buah`, correct: false },
                        { text: `${wrong2} buah`, correct: false }
                    ]
                });
            }
            return shuffleArray(list);
        }

        // --- BANK SOAL: MATH ENGLISH (TENS & HUNDREDS) ---
        function getMathEnglishBank() {
            let list = [];
            let icons = ['🔢', '➕', '➖', '🧮', '⭐', '🎈'];
            let baseTensOrHundreds = [30, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160, 170];
            let addVals = [10, 20, 30, 40, 50];

            for(let i = 0; i < baseTensOrHundreds.length; i++) {
                for(let j = 0; j < addVals.length; j++) {
                    let a = baseTensOrHundreds[i];
                    let b = addVals[j];
                    let sum = a + b;
                    
                    let textDisplay = `${a} + ${b} = ...`;
                    let textSpoken = `${numberToEnglish(a)} plus ${numberToEnglish(b)} equals?`;
                    let correctStr = numberToEnglish(sum);
                    let w1 = numberToEnglish(sum + 10);
                    let w2 = numberToEnglish(Math.max(10, sum - 10));
                    if (w1 === correctStr) w1 = numberToEnglish(sum + 20);

                    list.push({
                        img: icons[(a + b) % icons.length],
                        text: textDisplay,
                        spokenText: textSpoken,
                        isEnglish: true,
                        options: [
                            { text: `${numberToEnglish(sum)} (${sum})`, correct: true },
                            { text: `${w1} (${sum + 10})`, correct: false },
                            { text: `${w2} (${Math.max(10, sum - 10)})`, correct: false }
                        ]
                    });
                }
            }

            list.push({
                img: "🧮",
                text: `170 + 40 = ...`,
                spokenText: `one hundred seventy plus forty equals?`,
                isEnglish: true,
                options: [
                    { text: `two hundred ten (210)`, correct: true },
                    { text: `two hundred (200)`, correct: false },
                    { text: `two hundred twenty (220)`, correct: false }
                ]
            });
            list.push({
                img: "🔢",
                text: `150 + 50 = ...`,
                spokenText: `one hundred fifty plus fifty equals?`,
                isEnglish: true,
                options: [
                    { text: `two hundred (200)`, correct: true },
                    { text: `one hundred ninety (190)`, correct: false },
                    { text: `two hundred ten (210)`, correct: false }
                ]
            });

            return shuffleArray(list);
        }

        // --- BANK SOAL: OLIMPIADE TK ---
        function getOlimpiadeTKBank() {
            let base = [
                { img: "🧠", text: "Ibu membeli 6 buah mangga. Sebanyak 2 mangga diberikan kepada bibi, lalu paman datang membawa 3 mangga lagi. Berapa jumlah mangga sekarang?", options: [{text: "7 buah", correct: true}, {text: "6 buah", correct: false}, {text: "8 buah", correct: false}] },
                { img: "🔢", text: "Perhatikan deret bilangan loncat berikut: 3, 6, 9, 12, ... Berapakah angka berikutnya?", options: [{text: "15", correct: true}, {text: "14", correct: false}, {text: "16", correct: false}] },
                { img: "🧩", text: "Dalam sebuah barisan mainan, boneka beruang berada di urutan ke-4 dari depan dan urutan ke-4 dari belakang. Berapa jumlah total mainan dalam barisan itu?", options: [{text: "7 mainan", correct: true}, {text: "8 mainan", correct: false}, {text: "6 mainan", correct: false}] },
                { img: "⭐", text: "Jika hari ini adalah hari Kamis, hari apakah yang akan datang tiga hari lagi?", options: [{text: "Minggu", correct: true}, {text: "Sabtu", correct: false}, {text: "Senin", correct: false}] },
                { img: "📐", text: "Sebuah bangun ruang yang semua sisinya berbentuk persegi dan menyerupai kotak dadu disebut...", options: [{text: "Kubus", correct: true}, {text: "Bola", correct: false}, {text: "Tabung", correct: false}] },
                { img: "🎒", text: "Siti mempunyai 12 pensil warna. Dipinjam oleh temannya 5 pensil, lalu Siti membeli lagi 4 pensil baru. Berapa jumlah pensil Siti sekarang?", options: [{text: "11 pensil", correct: true}, {text: "10 pensil", correct: false}, {text: "12 pensil", correct: false}] },
                { img: "🔄", text: "Lanjutkan pola urutan bentuk berikut: 🟢 🟡 🔴 🟢 🟡 ...", options: [{text: "🔴", correct: true}, {text: "🟢", correct: false}, {text: "🟡", correct: false}] },
                { img: "⚖️", text: "Di antara benda-benda berikut, manakah yang paling ringan dan mudah diterbangkan angin?", options: [{text: "Sehelai Kertas", correct: true}, {text: "Batu Bata", correct: false}, {text: "Kamus Tebal", correct: false}] },
                { img: "⏱️", text: "Waktu dalam sehari saat bulan dan bintang mulai bermunculan di langit malam disebut...", options: [{text: "Malam hari", correct: true}, {text: "Siang hari", correct: false}, {text: "Pagi hari", correct: false}] },
                { img: "🎯", text: "Angka berapakah yang nilainya berada di tengah-tengah antara angka 4 dan angka 6?", options: [{text: "5", correct: true}, {text: "3", correct: false}, {text: "7", correct: false}] }
            ];
            let expanded = [...base];
            let extraTopics = [
                {i:"🏆", t:"Andi punya 8 kelereng, Budi punya 5 kelereng. Berapa selisih kelereng mereka?", o:[{text:"3 kelereng", c:true},{text:"4 kelereng", c:false},{text:"2 kelereng", c:false}]},
                {i:"🐱", t:"Ada 4 ekor kucing di teras, datang lagi 5 ekor kucing. Berapa jumlah kucing sekarang?", o:[{text:"9 ekor", c:true},{text:"8 ekor", c:false},{text:"10 ekor", c:false}]},
                {i:"🚗", t:"Di parkiran ada 10 mobil, pergi 3 mobil. Berapa sisa mobil di parkiran?", o:[{text:"7 mobil", c:true},{text:"6 mobil", c:false},{text:"8 mobil", c:false}]}
            ];
            for(let k=0; k<10; k++) {
                extraTopics.forEach((item) => {
                    expanded.push({
                        img: item.i,
                        text: item.t,
                        options: [
                            { text: item.o[0].text, correct: item.o[0].c },
                            { text: item.o[1].text, correct: item.o[1].c },
                            { text: item.o[2].text, correct: item.o[2].c }
                        ]
                    });
                });
            }
            return shuffleArray(expanded);
        }

        // --- BANK SOAL: ANGKA & HITUNG BENDA ---
        function getAngkaBank() {
            let list = [];
            let icons = ['🌟', '🍎', '🚗', '🎈', '🐶', '⚽', '🐱', '🍌', '🌸', '🐟'];
            for (let i = 1; i <= 50; i++) {
                let icon = icons[(i * 3) % icons.length];
                let count = (i % 12) + 1;
                let stringBenda = Array(count).fill(icon).join(' ');
                let correctVal = count;
                let w1 = correctVal === 15 ? 12 : correctVal + 2;
                let w2 = Math.max(1, correctVal - 2);
                if (w1 === correctVal) w1 = correctVal + 1;
                list.push({ 
                    img: stringBenda, 
                    text: `Hitunglah berapa jumlah total benda ${icon} pada kelompok gambar di atas?`, 
                    options: [
                        { text: correctVal.toString(), correct: true },
                        { text: w1.toString(), correct: false },
                        { text: w2.toString(), correct: false }
                    ] 
                });
            }
            return shuffleArray(list);
        }

        // --- BANK SOAL: HITUNG SERU ---
        function getHitungBank() {
            let list = [];
            for (let a = 1; a <= 10; a++) {
                for (let b = 1; b <= 10; b++) {
                    let hasil = a + b;
                    let w1 = hasil + 1;
                    let w2 = Math.max(1, hasil - 2);
                    if (w1 === w2) w2 = hasil + 2;
                    list.push({ 
                        img: "➕", 
                        text: `Berapakah hasil penjumlahan dari ${a} ditambah ${b}?`, 
                        options: [
                            { text: hasil.toString(), correct: true },
                            { text: w1.toString(), correct: false },
                            { text: w2.toString(), correct: false }
                        ] 
                    });
                }
            }
            return shuffleArray(list);
        }

        function getBentukBank() {
            return shuffleArray([
                { img: "🪙", text: "Koin uang logam dan roda sepeda berbentuk bangun datar...", options: [{text: "Lingkaran", correct: true}, {text: "Persegi", correct: false}, {text: "Segitiga", correct: false}] },
                { img: "📦", text: "Kotak kado ulang tahun berbentuk kubus memiliki sisi sebanyak...", options: [{text: "6 sisi sama besar", correct: true}, {text: "3 sisi", correct: false}, {text: "5 sisi", correct: false}] },
                { img: "🍕", text: "Potongan sepotong pizza atau atap rumah tradisional menyerupai bentuk...", options: [{text: "Segitiga", correct: true}, {text: "Persegi Panjang", correct: false}, {text: "Lingkaran", correct: false}] },
                { img: "🪟", text: "Jendela kaca kamar tidur yang sisi-sisinya sama panjang berbentuk...", options: [{text: "Persegi", correct: true}, {text: "Lonjong", correct: false}, {text: "Trapesium", correct: false}] },
                { img: "📺", text: "Layar televisi modern atau papan tulis di kelas umumnya berbentuk...", options: [{text: "Persegi Panjang", correct: true}, {text: "Segitiga", correct: false}, {text: "Lingkaran", correct: false}] }
            ]);
        }

        function getPolaBank() {
            return shuffleArray([
                { img: "🟡 🟢 🟡 🟢", text: "Lanjutkan pola urutan warna kuning dan hijau berikutnya dengan benar.", options: [{text: "🟡", correct: true}, {text: "🟢", correct: false}, {text: "🔴", correct: false}] },
                { img: "🍎 🍌 🍎 🍌", text: "Lanjutkan pola urutan buah apel dan pisang berikut.", options: [{text: "🍎", correct: true}, {text: "🍌", correct: false}, {text: "🍇", correct: false}] },
                { img: "2, 4, 6, 8", text: "Lanjutkan deret hitung loncat dua berikut: 2, 4, 6, 8, ...", options: [{text: "10", correct: true}, {text: "9", correct: false}, {text: "12", correct: false}] },
                { img: "⭐ ⭐ 🌙 ⭐ ⭐", text: "Lanjutkan pola urutan simbol bintang dan bulan sabit berikut.", options: [{text: "🌙", correct: true}, {text: "⭐", correct: false}, {text: "☀️", correct: false}] }
            ]);
        }

        function getKonsepBank() {
            return shuffleArray([
                { img: "🐋", text: "Manakah hewan laut berikut yang ukuran tubuhnya paling besar di bumi?", options: [{text: "Paus Biru", correct: true}, {text: "Ikan Hias", correct: false}, {text: "Kepiting Kecil", correct: false}] },
                { img: "🐞", text: "Hewan kecil bertotol merah apakah yang ukurannya sangat mini?", options: [{text: "Kumbang / Kepik", correct: true}, {text: "Kuda", correct: false}, {text: "Gajah", correct: false}] },
                { img: "🦒", text: "Hewan sabana manakah yang memiliki ciri khas leher paling tinggi?", options: [{text: "Jerapah", correct: true}, {text: "Kelinci", correct: false}, {text: "Bebek", correct: false}] }
            ]);
        }

        function getMewarnaiBank() {
            return shuffleArray([
                { img: "🎨", text: "Jika warna biru dicampur dengan warna merah, akan menghasilkan warna...", options: [{text: "Ungu", correct: true}, {text: "Hijau", correct: false}, {text: "Kuning", correct: false}] },
                { img: "🎨", text: "Jika warna kuning dicampur dengan warna biru, akan menghasilkan warna...", options: [{text: "Hijau", correct: true}, {text: "Merah", correct: false}, {text: "Oranye", correct: false}] },
                { img: "🎨", text: "Manakah yang merupakan kelompok warna primer (dasar) dalam seni lukis?", options: [{text: "Merah, Kuning, Biru", correct: true}, {text: "Pink, Ungu, Cokelat", correct: false}, {text: "Emas dan Perak", correct: false}] }
            ]);
        }

        function getHewanBank() {
            return shuffleArray([
                { img: "🐧", text: "Hewan kutub unik bersayap yang tidak bisa terbang namun pandai berenang adalah...", options: [{text: "Pinguin", correct: true}, {text: "Elang", correct: false}, {text: "Merpati", correct: false}] },
                { img: "🦋", text: "Serangga cantik bersayap warna-warni yang berasal dari metamorfosis ulat adalah...", options: [{text: "Kupu-kupu", correct: true}, {text: "Nyamuk", correct: false}, {text: "Lalat", correct: false}] },
                { img: "🐯", text: "Hewan buas karnivora berkulit belang oren-hitam yang dijuluki harimau adalah...", options: [{text: "Harimau", correct: true}, {text: "Kelinci", correct: false}, {text: "Kambing", correct: false}] }
            ]);
        }

        function getTumbuhanBank() {
            return shuffleArray([
                { img: "🌱", text: "Bagian tanaman yang tertanam di dalam tanah dan berfungsi menyerap air adalah...", options: [{text: "Akar", correct: true}, {text: "Daun", correct: false}, {text: "Bunga", correct: false}] },
                { img: "🌿", text: "Bagian tanaman yang umumnya berwarna hijau dan berfungsi untuk bernapas adalah...", options: [{text: "Daun", correct: true}, {text: "Akar", correct: false}, {text: "Batang", correct: false}] }
            ]);
        }

        function getInggrisBank() {
            return shuffleArray([
                { img: "🔵", text: "Apakah terjemahan bahasa Inggris dari warna biru?", options: [{text: "Blue", correct: true}, {text: "Red", correct: false}, {text: "Yellow", correct: false}] },
                { img: "5️⃣", text: "Apakah bahasa Inggris dari angka lima?", options: [{text: "Five", correct: true}, {text: "Ten", correct: false}, {text: "One", correct: false}] },
                { img: "🐶", text: "Apa arti kosakata bahasa Inggris 'dog' dalam bahasa Indonesia?", options: [{text: "Anjing", correct: true}, {text: "Kucing", correct: false}, {text: "Kelinci", correct: false}] }
            ]);
        }

        function startQuiz(category) {
            let pool = [];
            if (category === 'hitung_gambar') {
                pool = getHitungGambarBank();
                totalQuestionsCount = 20;
            } else if (category === 'olimpiade_tk') {
                pool = getOlimpiadeTKBank();
                totalQuestionsCount = 10;
            } else if (category === 'angka') {
                pool = getAngkaBank();
                totalQuestionsCount = 10;
            } else if (category === 'hitung') {
                pool = getHitungBank();
                totalQuestionsCount = 10;
            } else if (category === 'math_eng') {
                pool = getMathEnglishBank();
                totalQuestionsCount = 10;
            } else if (category === 'bentuk') {
                pool = getBentukBank();
                totalQuestionsCount = 10;
            } else if (category === 'pola') {
                pool = getPolaBank();
                totalQuestionsCount = 10;
            } else if (category === 'konsep') {
                pool = getKonsepBank();
                totalQuestionsCount = 10;
            } else if (category === 'mewarnai') {
                pool = getMewarnaiBank();
                totalQuestionsCount = 10;
            } else if (category === 'hewan') {
                pool = getHewanBank();
                totalQuestionsCount = 10;
            } else if (category === 'tumbuhan') {
                pool = getTumbuhanBank();
                totalQuestionsCount = 10;
            } else if (category === 'inggris') {
                pool = getInggrisBank();
                totalQuestionsCount = 10;
            } else if (category === 'semua') {
                let mixPool = [
                    ...shuffleArray(getHitungGambarBank()).slice(0, 4),
                    ...shuffleArray(getOlimpiadeTKBank()).slice(0, 3),
                    ...shuffleArray(getMathEnglishBank()).slice(0, 3),
                    ...shuffleArray(getHitungBank()).slice(0, 3),
                    ...shuffleArray(getBentukBank()).slice(0, 2),
                    ...shuffleArray(getPolaBank()).slice(0, 2),
                    ...shuffleArray(getHewanBank()).slice(0, 1),
                    ...shuffleArray(getInggrisBank()).slice(0, 2)
                ];
                pool = shuffleArray(mixPool);
                totalQuestionsCount = 20;
            }

            currentQuestions = getUniqueQuestions(pool, totalQuestionsCount);
            currentIndex = 0;
            score = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('question-progress').innerText = `Soal ${currentIndex + 1} dari ${totalQuestionsCount}`;
            document.getElementById('score-tracker').innerText = `🏆 Skor: ${score}`;
            
            document.getElementById('question-image').innerText = q.img;
            document.getElementById('question-text').innerText = q.text;

            speakText(q.spokenText || q.text, q.isEnglish ? 'en-US' : 'id-ID');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            let shuffledOpts = shuffleArray(q.options);

            shuffledOpts.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-white/90 hover:bg-white border-2 border-indigo-100 hover:border-indigo-400 font-bold py-3.5 px-4 rounded-2xl shadow-sm transition-all transform hover:scale-[1.01] active:scale-95 text-slate-700 flex items-center gap-3.5 text-base md:text-lg";
                btn.innerHTML = `<span class="w-8 h-8 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm font-extrabold shadow-sm">${String.fromCharCode(65 + index)}</span> <span>${item.text}</span>`;
                
                btn.onclick = () => {
                    playSound('click');
                    selectOption(item.correct, index, shuffledOpts);
                };
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(isCorrect, selectedIndex, optionsList) {
            const options = document.getElementById('options-container').children;
            const feedback = document.getElementById('feedback-container');
            const q = currentQuestions[currentIndex];
            
            for (let i = 0; i < options.length; i++) {
                options[i].disabled = true;
                if (optionsList[i].correct) {
                    options[i].classList.remove('bg-white/90', 'border-indigo-100');
                    options[i].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'shadow-md');
                } else if (i === selectedIndex && !isCorrect) {
                    options[i].classList.remove('bg-white/90', 'border-indigo-100');
                    options[i].classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                }
            }

            const pointsPerQuestion = Math.round(100 / totalQuestionsCount);
            if (isCorrect) {
                playSound('correct');
                score += pointsPerQuestion;
                feedback.className = "mb-3 p-3 rounded-2xl text-center font-bold text-base bg-emerald-100 text-emerald-800 border-2 border-emerald-200 animate-pop";
                feedback.innerText = "🌟 Pintar Sekali! Jawabanmu Benar! 🎉";
                if (q.isEnglish) {
                    speakText("Correct, great job!", "en-US");
                } else {
                    speakText("Benar, hebat sekali!");
                }
            } else {
                playSound('wrong');
                feedback.className = "mb-3 p-3 rounded-2xl text-center font-bold text-base bg-rose-100 text-rose-800 border-2 border-emerald-200 animate-pop";
                feedback.innerText = "💪 Belum Tepat, Yuk Coba Lagi di Soal Berikutnya!";
                if (q.isEnglish) {
                    speakText("Incorrect, try again!", "en-US");
                } else {
                    speakText("Belum tepat, ayo coba lagi!");
                }
            }

            feedback.classList.add('block');
            feedback.classList.remove('hidden');
            document.getElementById('score-tracker').innerText = `🏆 Skor: ${score}`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                playSound('correct');
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score-text').innerText = `Hebat! Total skor akhirmu adalah ${score} dari 100. Calon juara masa depan!`;
                speakText("Luar biasa! Kamu telah menyelesaikan semua latihan hari ini.");
            }
        }

        function resetQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
